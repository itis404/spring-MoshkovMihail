<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Not found | Tounip</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<main class="error-page">
    <section class="error-card">
        <div class="error-code">404</div>

        <h1>Page not found</h1>

        <p>
            The room, channel or page you are looking for does not exist.
            It may have been deleted or the link may be incorrect.
        </p>

        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/spaces}">Back to rooms</a>
            <a class="btn btn-secondary" th:href="@{/}">Home</a>
        </div>
    </section>
</main>

</body>
</html>
