<section class="space-center" th:fragment="callPanel">
    <div class="call-stage"
         th:if="${selectedChannel != null}"
         th:data-channel-id="${selectedChannel.id}">

        <div class="call-header">
            <div>
                <h2 th:text="'# ' + ${selectedChannel.name}"># general</h2>
                <p>Video call</p>
            </div>

            <span id="callStatus">not connected</span>
        </div>

        <div id="videoArea" class="video-area">
            <div class="video-placeholder">
                Join the call to see video here
            </div>
        </div>
    </div>

    <div class="call-controls" th:if="${selectedChannel != null}">
        <button type="button" id="joinCallButton" class="btn btn-primary">Join</button>
        <button type="button" id="leaveCallButton" class="btn" disabled>Leave</button>
        <button type="button" id="toggleMicButton" class="btn" disabled>Mic off</button>
        <button type="button" id="toggleCameraButton" class="btn" disabled>Camera off</button>
        <button type="button" id="toggleScreenButton" class="btn" disabled>Share screen</button>
    </div>

    <div class="empty-state" th:if="${selectedChannel == null}">
        <h2>No channel selected</h2>
        <p>Create or select a channel to start.</p>
    </div>
</section>
