<aside class="space-right" th:fragment="rightPanel">
    <section class="members-box">
        <div class="members-header">
            <h2>Members</h2>
            <button type="button" id="toggleMembersButton" class="link-button">
                hide
            </button>
        </div>

        <div id="membersList" class="members-list">
            <div class="member-item"
                 th:each="member : ${members}"
                 th:text="${member.username}">
                username
            </div>
        </div>
    </section>

    <section class="chat-box" th:if="${selectedChannel != null}">
        <div class="chat-header">
            <h2>Chat</h2>
            <p th:text="'# ' + ${selectedChannel.name}"># general</p>
        </div>

        <div id="messagesList" class="messages-list">
            <div class="message-card"
                 th:each="message : ${messages}"
                 th:data-message-id="${message.id}">

                <div class="message-author"
                     th:text="${message.authorPublicName}">
                    User
                </div>

                <div class="message-content"
                     th:text="${message.content}">
                    Message
                </div>

                <button type="button"
                        class="link-button translate-button"
                        th:data-message-id="${message.id}">
                    translate
                </button>

                <div class="translation-result"></div>
            </div>
        </div>

        <form id="messageForm"
              class="message-form"
              th:data-channel-id="${selectedChannel.id}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <input id="messageInput"
                   type="text"
                   name="content"
                   placeholder="Write a message..."
                   required>

            <button type="submit">Send</button>
        </form>
    </section>

    <section class="chat-box" th:if="${selectedChannel == null}">
        <div class="empty-state">
            <h2>No channel selected</h2>
            <p>Create or select a channel to start chatting.</p>
        </div>
    </section>
</aside>
