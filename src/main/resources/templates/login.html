<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tounip - Login</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-logo">Tounip</div>

        <h1>Login</h1>
        <p class="auth-subtitle">Enter your phone number and password.</p>

        <div class="error global-error" th:if="${param.error}">
            Invalid phone number or password.
        </div>

        <div class="alert alert-success" th:if="${param.registered}">
            Account created. You can log in now.
        </div>

        <form method="post" th:action="@{/login}" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="phoneNumber">Phone number</label>
                <input id="phoneNumber" type="text" name="phoneNumber" placeholder="+79990001122" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">login</button>
        </form>

        <p class="auth-helper">
            No account?
            <a th:href="@{/register}">Create one</a>
        </p>
    </section>
</main>

</body>
</html>
