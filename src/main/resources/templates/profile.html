<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tounip - Profile</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="profile-page">
    <section class="profile-card">
        <header class="profile-card__header">
            <h1>Your profile</h1>
            <p>Manage your visible name, email and translation language.</p>
        </header>

        <div class="profile-card__body">
            <aside class="profile-avatar-block">
                <div class="avatar-wrapper avatar-letter">
                    <span th:text="${#strings.substring(profile.publicName, 0, 1)}">T</span>
                </div>

                <h2 th:text="${profile.publicName}">Public name</h2>
                <p class="muted" th:text="'@' + ${profile.username}">@username</p>
            </aside>

            <section class="profile-info-block">
                <div class="profile-details">
                    <div class="profile-field">
                        <div class="profile-field__label">Phone</div>
                        <div class="profile-field__value" th:text="${profile.phoneNumber}">phone</div>
                    </div>

                    <div class="profile-field">
                        <div class="profile-field__label">Email</div>
                        <div class="profile-field__value" th:text="${profile.email ?: 'not set'}">email</div>
                    </div>

                    <div class="profile-field">
                        <div class="profile-field__label">Preferred language</div>
                        <div class="profile-field__value" th:text="${profile.preferredLanguage}">ru</div>
                    </div>
                </div>

                <div class="alert alert-success" th:if="${param.updated}">
                    Profile updated.
                </div>

                <div class="error global-error" th:if="${profileError}" th:text="${profileError}">
                    error
                </div>

                <div class="profile-edit-box">
                    <h2>Edit profile</h2>

                    <form method="post" th:action="@{/profile}" th:object="${profileForm}" class="profile-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="form-group">
                            <label for="username">Username</label>
                            <input id="username" type="text" th:field="*{username}" class="input-text" required>
                            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                                username error
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="publicName">Public name</label>
                            <input id="publicName" type="text" th:field="*{publicName}" class="input-text" required>
                            <div class="error" th:if="${#fields.hasErrors('publicName')}" th:errors="*{publicName}">
                                public name error
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input id="email" type="email" th:field="*{email}" class="input-text">
                            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                email error
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="preferredLanguage">Preferred translation language</label>
                            <select id="preferredLanguage" th:field="*{preferredLanguage}" class="input-text">
                                <option value="ru">Russian</option>
                                <option value="en">English</option>
                                <option value="es">Spanish</option>
                                <option value="de">German</option>
                                <option value="fr">French</option>
                            </select>
                            <div class="error" th:if="${#fields.hasErrors('preferredLanguage')}" th:errors="*{preferredLanguage}">
                                language error
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save profile</button>
                    </form>
                </div>
            </section>
        </div>
    </section>
</main>

</body>
</html>
