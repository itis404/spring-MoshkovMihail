<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tounip - Registration</title>

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">

    <script th:src="@{/js/register.js}" defer></script>
</head>
<body>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-logo">Tounip</div>

        <h1>Registration</h1>
        <p class="auth-subtitle">Create an account to join rooms and calls.</p>

        <div class="error global-error" th:if="${registrationError}" th:text="${registrationError}">
            Registration error
        </div>

        <form method="post" th:action="@{/register}" th:object="${registrationRequest}" id="regForm" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label for="phoneNumber">Phone number</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="+79990001122" required>
                <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}">
                    Phone error
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com">
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                    Email error
                </div>
            </div>

            <div class="form-group">
                <label for="preferredLanguage">Preferred translation language</label>
                <select id="preferredLanguage" th:field="*{preferredLanguage}">
                    <option value="ru">Russian</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="fr">French</option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('preferredLanguage')}" th:errors="*{preferredLanguage}">
                    Language error
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Minimum 6 symbols" required>
                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    Password error
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Repeat password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                <div class="error" id="passwordRepeatError"></div>
            </div>

            <button type="submit" class="btn btn-primary auth-btn">register</button>
        </form>

        <p class="auth-helper">
            Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>
    </section>
</main>

</body>
</html>
