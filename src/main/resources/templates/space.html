<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${space.name} + ' | Tounip'">Tounip Space</title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/space.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="space-page">
    <div th:replace="~{fragments/space-sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/call-panel :: callPanel}"></div>
    <div th:replace="~{fragments/right-panel :: rightPanel}"></div>
</main>

<script th:src="@{/js/vendor/livekit-client.umd.js}"></script>
<script th:src="@{/js/space.js}"></script>
<script th:src="@{/js/livekit-call.js}"></script>
</body>
</html>
